name: Reproduce offline
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python verify_evidence.py
      - run: python analyze.py --verify
      - run: python research/next-study/verify_study.py
      - run: python research/layout-boundary/layout_study.py build
      - run: python research/layout-boundary/verify_layout.py
      - run: python research/evidence-gap/gap_run.py build
      - run: python research/evidence-gap/verify_gap.py
      - run: python research/evidence-gap/review_tools.py verify
      - run: python research/evidence-gap/release_tools.py --verify
      - run: python research/evidence-guards/guard_study.py prepare
      - run: python research/evidence-guards/verify_guards.py
      - run: python research/evidence-guards/publish_guards.py --verify
      - run: python research/fact-execution/data_tools.py verify
      - run: python research/fact-execution/fact_run.py build
      - run: python research/fact-execution/fact_analyze.py --verify
      - run: python research/fact-execution/publish_facts.py --verify
      - run: python research/fact-execution/review_pair_tools.py
      - run: python research/fact-execution/review_starter.py --verify
      - run: python research/fact-execution/line_evidence.py
      - run: python research/fact-execution/line_plan_tools.py verify
      - run: python research/fact-execution/line_run.py verify-freeze
      - run: python research/fact-execution/line_analyze.py --verify
      - run: python research/fact-execution/paired_parent_audit.py verify
      - run: python research/fact-execution/line_oracle_decomposition.py --verify
      - run: python research/fact-execution/publish_line.py --verify
      - run: python research/fact-execution/joint_route_plan.py verify
      - run: python research/fact-execution/joint_token_control.py verify
      - run: python research/fact-execution/joint_execution.py verify-freeze
      - run: python research/fact-execution/joint_analyze.py --verify
      - run: python research/fact-execution/publish_joint.py --verify
      - run: python research/fact-execution/scope_gate_audit.py verify
      - run: python research/request-ownership/prepare.py verify
      - run: python research/request-ownership/execution.py verify-freeze
      - run: python research/request-ownership/analyze.py --verify
      - run: python research/request-ownership/plot_results.py verify
      - run: python research/payment-ownership/verify_run.py
      - run: python research/candidate-completeness/study.py verify-freeze
      - run: python research/candidate-completeness/analyze.py --verify
      - run: python research/candidate-completeness/publish.py --verify
      - run: python research/candidate-completeness/review_tools.py --verify
      - run: python research/candidate-completeness/reasoning_analyze.py --verify
      - run: python research/candidate-completeness/reasoning_report.py --verify
      - run: python research/candidate-completeness/plot_results.py --verify
      - run: python research/decision-sufficiency/build.py --verify
      - run: python research/baseline-readiness/preflight.py verify
      - run: python research/baseline-readiness/qwen35_report.py --verify
      - run: python research/generation-calibration/prepare.py
      - run: python research/generation-calibration/analyze.py --verify
      - run: python research/external-validation/publish_review.py verify
      - run: python research/action-backends/plan.py
      - run: python research/action-backends/analyze.py --verify
      - run: python docs/build_four_line_challenge.py verify
      - run: python docs/build_risk_tradeoff.py verify
      - run: python docs/build_request_switch.py verify
      - run: python verify_publication.py
      - run: python research/source-label-screen/jev_audit.py --verify
      - run: python research/source-label-screen/report.py verify
      - run: python research/finite-choice-readout/analyze_finite.py verify
      - run: python research/source-label-screen/replay.py --verify
      - run: python replicate.py --backend qwen --phase smoke --output .local/ci-smoke --dry-run
