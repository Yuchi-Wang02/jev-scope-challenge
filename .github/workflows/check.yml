name: Reproduce offline
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python verify_evidence.py
      - run: python analyze.py --verify
      - run: python research/next-study/verify_study.py
      - run: python research/layout-boundary/layout_study.py build
      - run: python replicate.py --backend qwen --phase smoke --output .local/ci-smoke --dry-run
