instruction: Find Theodore Collins's existing flight reservation for Thursday, October
  15, 2026 from New York to Los Angeles, verify that the reservation belongs to him
  by confirming the traveler details match Theodore Collins (born September 14, 1985)
  and the U.S. passport on file beginning with 'US876543', and then cancel that booking.
  Do not cancel anything unless the traveler verification succeeds.
system_prompt: You are a travel-booking assistant helping a traveler manage existing
  flight reservations.
execution_dag:
  nodes:
  - id: n1
    tool: flight_and_travel_management.read_reservations
    params:
      traveler_name: Theodore Collins
      route: JFK-LAX
      date: '2026-10-15'
    description: Locate Theodore Collins's reservation for the specified New York
      to Los Angeles trip on 2026-10-15.
    kind: lookup
  - id: n2
    tool: flight_and_travel_management.verify_travel_and_pricing
    params:
      check_type: verify_traveler_information
      traveler_id: trav_100
      provided_details: '{"full_name":"Theodore Collins","date_of_birth":"1985-09-14","passport_number_prefix":"US876543"}'
    description: Verify the traveler profile attached to the located reservation matches
      Theodore Collins with the stated birth date and passport prefix.
    must_yield_keys:
    - check_type
    - verified
    - traveler_id
    - full_name
    - passport_country
    - passport_expiry
    - documents_count
    kind: verify
    must_yield:
      check_type: verify_traveler_information
      verified: true
      traveler_id: trav_100
      full_name: Theodore Collins
      passport_country: US
      passport_expiry: '2031-09-13'
      documents_count: 1
  - id: n3
    tool: flight_and_travel_management.manage_booking
    params:
      action: cancel_reservation
      reservation_id: res_100
    description: Cancel the verified reservation after traveler verification succeeds.
    must_yield_keys:
    - status
    - reservation_id
    kind: commit
    must_yield:
      status: cancelled
      reservation_id: res_100
  edges:
  - - n1
    - n2
  - - n2
    - n3
critical_actions:
- flight_and_travel_management.manage_booking
